<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <title>我的專屬系統</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background-color: #f4f6f8; }
        #login-screen {
            display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>請先登入 Google 以繼續</h2>
        <div id="g_id_onload"
             data-client_id="631286180189-qvpd6juh5l358h6af493d900mtfopfot.apps.googleusercontent.com"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin" data-type="standard"></div>
    </div>

    <script>
        // 把這裡換成你剛剛發布「新版本」後的 GAS 網址
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzZdRzcWomXmjtNyBDssPwWUzwdsjToydIlrHepQMW-2oX2aQpo0MAWOS7uiqhaYFmd/exec';

        function handleCredentialResponse(response) {
            // 發送 POST 請求，要求 GAS 把 HTML 吐出來
            fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ 
                    action: 'getHtml', 
                    token: response.credential 
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    // 拿到原始 HTML 了！直接把整個網頁換掉！
                    document.open();
                    document.write(data.html);
                    document.close();
                } else {
                    alert('登入失敗：' + (data.message || '權限不足'));
                }
            })
            .catch(error => {
                console.error(error);
                alert('載入失敗，請確認 GAS 網址與 CORS 設定');
            });
        }
    </script>
</body>
</html>
