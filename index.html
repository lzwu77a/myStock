<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <title>股票資產管理儀表板</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background-color: #f4f6f8; }
        #login-screen {
            display: none; 
            flex-direction: column; justify-content: center; align-items: center; height: 100vh;
        }
        #loading-screen {
            display: flex; 
            flex-direction: column; justify-content: center; align-items: center; height: 100vh;
            color: #555;
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <h2>🔄 系統載入中，請稍候...</h2>
    </div>

    <div id="login-screen">
        <h2>請先登入 Google 以繼續</h2>
        <div id="g_id_onload"
             data-client_id="631286180189-qvpd6juh5l358h6af493d900mtfopfot.apps.googleusercontent.com" 
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin" data-type="standard"></div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwXeh_4ePOs-RlzsdtKjUTApEsqb5Z1kReLVaAGSZ5NHHuMV_VN4RUNQ5lrrj2VbCRL/exec";

        // 1. 網頁一載入，統一檢查 'myAppSession'
        window.onload = function() {
            const savedSession = localStorage.getItem('myAppSession'); 
            
            if (savedSession) {
                loadDashboard(savedSession);
            } else {
                showLoginScreen();
            }
        };

        // 2. Google 登入按鈕成功後觸發
        function handleCredentialResponse(response) {
            const googleToken = response.credential; // 統一命名為 googleToken
            
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('loading-screen').style.display = 'flex';

            // 向 GAS 發送 action: 'loginAndGetSession' 來換取長效鑰匙
            fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ 
                    action: 'loginAndGetSession', 
                    token: googleToken 
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    // 登入成功，將長效期 Token 存起來
                    localStorage.setItem('myAppSession', data.sessionToken);
                    console.log("登入成功，已取得長效授權！");
                    // 將拿到的長效鑰匙傳給 loadDashboard 繼續載入畫面
                    loadDashboard(data.sessionToken);
                } else {
                    alert("登入失敗：" + data.message);
                    showLoginScreen();
                }
            })
            .catch(err => {
                console.error("登入請求失敗", err);
                showLoginScreen();
            });
        }

        // 3. 負責向 GAS 拿 HTML 的核心邏輯 (使用長效鑰匙)
        function loadDashboard(sessionToken) {
            fetch(GAS_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ 
                    action: 'getHtml', 
                    token: sessionToken 
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    document.open();
                    document.write(data.html);
                    document.close();
                    document.title = data.title || "股票資產管理儀表板";
                } else {
                    console.log('連線失效：', data.message);
                    // 統一清除 'myAppSession'
                    localStorage.removeItem('myAppSession'); 
                    showLoginScreen();
                }
            })
            .catch(error => {
                console.error(error);
                alert('載入失敗，請確認網路連線');
                showLoginScreen();
            });
        }

        // 4. 顯示登入畫面
        function showLoginScreen() {
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
        }

        async function handleLogout() {
          const sessionToken = localStorage.getItem('myAppSession');
  
          if (sessionToken) {
            try {
              // 1. 通知後端把 Google Sheet 裡的那列資料刪掉，讓這把鑰匙徹底失效
              await callGAS('logoutUser', sessionToken);
            } catch (e) {
              console.warn("通知後端登出時發生異常，但前端仍會清除狀態", e);
            }
          }
          
          // 2. 清除瀏覽器裡的鑰匙
          localStorage.removeItem('myAppSession');
          
          // 3. 重新載入網頁，系統抓不到 Token 就會自動退回 Google 登入畫面
          alert("已成功登出！");
          window.location.reload(); 
        }
    </script>
</body>
</html>
